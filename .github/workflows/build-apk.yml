name: Build APK & iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: sansu-kore-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

    - name: Upload AAB to Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: sansu-kore-aab
        path: build/app/outputs/bundle/release/app-release.aab
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build iOS (unsigned)
      run: flutter build ios --release --no-codesign

    - name: Archive iOS build output
      run: |
        mkdir -p ios_build_output
        cp -r build/ios/iphoneos/Runner.app ios_build_output/ || true

    - name: Upload iOS build to Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: sansu-kore-ios-unsigned
        path: ios_build_output
        retention-days: 30
